{% extends "base.html" %}
{% load static %}

{% block title %}Login | Weather Dashboard{% endblock %}

{% block content %}
<main class="auth-shell">
    <section class="auth-card">
        <div class="brand-block">
            <span class="brand-mark">W</span>
            <div>
                <p class="eyebrow">Weather Dashboard</p>
                <h1>Sign in</h1>
            </div>
        </div>

        <form id="login-form" class="stacked-form">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="primary-button" type="submit">Login</button>
        </form>

        <p id="form-message" class="message" aria-live="polite"></p>
        <p class="auth-switch">Need an account? <a href="/register/">Register</a></p>
    </section>
</main>
<script src="{% static 'js/auth.js' %}" defer></script>
{% endblock %}
